<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灰色标题、颜色还可以</title>
    <style>
        .title-container {
            background-color: #f5f5f5; /* 背景颜色改为浅灰色 */
            border: 2px solid #cccccc; /* 边框颜色改为浅灰色 */
            border-radius: 10px; /* 圆角半径 */
            padding: 10px 20px; /* 内边距调整 */
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1); /* 添加阴影 */
            display: inline-block; /* 使容器适应内容宽度 */
        }

        .title-container h2 {
            color: #333333; /* 标题颜色改为深灰色 */
            font-family: 'Arial', sans-serif; /* 字体改为 Arial */
            font-weight: bold; /* 加粗 */
            margin: 0; /* 去除默认的外边距 */
        }

    </style>
</head>
<body>
    
    <div class="title-container">
        <h2>二、项目文件夹说明</h2>
    </div>
        

</body>
</html>
